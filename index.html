<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic AI in Computational Pathology</title>
    <meta name="description" content="A curated list of agentic AI systems in computational pathology, including reasoning agents, multi-agent systems, and interactive copilots.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-glow bg-glow-2"></div>
    
    <header>
        <div class="container" style="position: relative;">
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle Theme">
                <i class="ph ph-sun" id="themeIcon"></i>
            </button>
            <h1 class="gradient-text">Agentic AI in Computational Pathology</h1>
            <p class="subtitle">A comprehensive summary of agentic AI systems, LLM agents, and copilots for computational pathology.</p>

            <div class="header-actions" style="margin-top: 1.5rem; display: flex; justify-content: center; gap: 1rem;">
                <a href="https://github.com/researchsubmissions66/Agentic-AI-CPath" class="action-btn" target="_blank"><i class="ph ph-github-logo"></i> GitHub</a>
                <button id="bibtexBtn" class="action-btn" title="Copy BibTeX citation for this site"><i class="ph ph-code"></i> BibTeX</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="controls">
            <div class="search-box">
                <i class="ph ph-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search agents, systems, or ideas..." aria-label="Search agents, systems, or ideas">
            </div>
            <div class="filter-box">
                <select id="categoryFilter" aria-label="Filter by category">
                    <option value="all">All Categories</option>
                    <!-- Options populated via JS -->
                </select>
            </div>
            <button id="facetBtn" class="facet-toggle" aria-expanded="false" title="Filter by metadata">
                <i class="ph ph-sliders-horizontal"></i> Filters<span id="facetCount" class="facet-count" hidden>0</span>
            </button>
            <div class="view-toggle">
                <button id="gridBtn" class="view-btn" aria-label="Grid View"><i class="ph ph-squares-four"></i></button>
                <button id="tableBtn" class="view-btn active" aria-label="Table View"><i class="ph ph-list-dashes"></i></button>
                <button id="timelineBtn" class="view-btn" aria-label="Timeline View"><i class="ph ph-clock-countdown"></i></button>
                <button id="treeBtn" class="view-btn" aria-label="Tree View"><i class="ph ph-tree-structure"></i></button>
            </div>
        </div>

        <div id="facetPanel" class="facet-panel" hidden></div>

        <div id="modelsContainer" class="models-container">
            <!-- Categories and Cards rendered via JS -->
        </div>
    </main>

    <footer>
        <div class="container">
            <p style="font-size: 0.95rem; color: var(--text-secondary);">
                <strong style="color: var(--text-primary); font-size: 1.05rem;">Anonymous Authors</strong><br>
                Anonymous Submission
            </p>
        </div>
    </footer>

    <!-- Metadata Modal -->
    <div id="metadataModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title-group">
                    <h3 id="modalTitle">Model Name</h3>
                    <div id="modalSubtitle" class="modal-subtitle"></div>
                </div>
                <button class="close-modal" id="closeModal" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Table injected here via JS -->
            </div>
        </div>
    </div>

    <!-- Data and Scripts -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
